[project]
name = "z3-target-bigquery"
version = "0.7.2"
description = "z3-target-bigquery is a Singer target for BigQuery. It supports storage write, GCS, streaming, and batch load methods. Built with the Meltano SDK."
authors = [{ name = "Alex Butler", email = "butler.alex2010@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
keywords = [
    "ELT",
    "BigQuery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "singer-sdk~=0.54.5",
    "google-cloud-bigquery[bqstorage]>=3.44,<4",
    "orjson>=3.12,<4",
    "tenacity>=8.0.1,<9",
    "grpcio-tools>=1.83,<2",
    "google-cloud-storage>=2.7.0,<3",
    "grpcio-status>=1.51.1,<2",
    "pyarrow>=25",
    "adbc-driver-manager>=0.11",
]

[project.urls]
Homepage = "https://github.com/z3z1ma/target-bigquery"
Repository = "https://github.com/z3z1ma/target-bigquery"

[project.scripts]
target-bigquery = "target_bigquery.target:TargetBigQuery.cli"

[dependency-groups]
dev = [
    "pytest>=9",
    "tox>=4",
    "mypy>=2.3.1",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.5",
]

[tool.hatch.build.targets.sdist]
include = [
    "target_bigquery/*.py",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.sdist.force-include]
"target_bigquery/*.py" = "target_bigquery/*.py"
"README.md" = "README.md"
LICENSE = "LICENSE"

[tool.hatch.build.targets.wheel]
include = [
    "target_bigquery/*.py",
    "README.md",
    "LICENSE",
]

[tool.hatch.version]
fallback-version = "0.0.0dev0"
source = "vcs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
