name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**.py"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "uv.lock"
  workflow_dispatch:
    inputs: {}

concurrency:
  # github.head_ref is empty on push events; fall back to github.ref, not
  # github.run_id, so concurrent pushes to the same branch actually cancel each other.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

permissions:
  contents: read

jobs:
  build:
    name: Test
    strategy:
      matrix:
        py_version:
          - "3.10"
          - "3.14"
    runs-on: ubuntu-latest
    env:
      BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
      BQ_DATASET: ${{ secrets.BQ_DATASET }}
      BQ_CREDS: ${{ secrets.BQ_CREDS }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.py_version }}
      - name: Install Target Bigquery
        run: uv sync
      - name: Install BigQuery ADBC driver (for Arrow BATCH tests)
        run: uvx dbc sync
      - name: Run SDK Tests
        run: uv run pytest -k test_core
      - name: Run Bigquery Unit Tests
        run: uv run pytest -k test_utils
      - name: Run Bigquery Integration Tests
        run: uv run pytest -k test_sync
