requires_meltano: '>=4.2'
send_anonymous_usage_stats: true
project_id: target-bigquery
default_environment: testing
environments:
- name: testing
plugins:
  extractors:
  - name: "tap-smoke-test"
    namespace: "tap_smoke_test"
    executable: "tap-smoke-test"
    pip_url: "git+https://github.com/meltano/tap-smoke-test.git"
    config:
      streams:
      - stream_name: animals
        "input_filename": "https://gitlab.com/meltano/tap-smoke-test/-/raw/main/demo-data/animals-data.jsonl"
      - stream_name: page_views
        "input_filename": "https://gitlab.com/meltano/tap-smoke-test/-/raw/main/demo-data/pageviews-data.jsonl"
      stream_maps:
        "animals":
          "__key_properties__": ["id"]
        "page_views":
          "__key_properties__": ["vistor_id"]
  loaders:
  - name: target-bigquery
    namespace: target_bigquery
    pip_url: -e .
    capabilities:
    - about
    - batch
    - stream-maps
    - record-flattening
    config:
      project: ${BQ_PROJECT}
      method: storage_write_api
      denormalized: true
      credentials_json: ${BQ_CREDS}
      dataset: target_bigquery_tests
      batch_size: 500
      timeout: 300
